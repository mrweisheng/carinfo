version: '3.8'

services:
  carinfo-scraper:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: carinfo-scraper
    restart: unless-stopped
    # 添加extra_hosts来确保host.docker.internal在Linux上也能工作
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Hong_Kong
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=1qaz!QAZ2wsx@WSX
      - MYSQL_DATABASE=car_info_db
    volumes:
      # 挂载配置文件
      - ./config.json:/app/config.json
      - ./proxy_config.json:/app/proxy_config.json
      # 挂载数据目录
      - ./data:/app/data
      - ./logs:/app/logs
      - ./debug_pages:/app/debug_pages
      # 挂载CSV输出目录
      - ./csv_output:/app/csv_output
    networks:
      - carinfo-network
    # 默认使用单次运行模式
    command: ["python", "carinfo.py", "--config"]
    # 如果需要定时任务，请使用调度器服务
    # command: ["python", "scheduler.py"]
    
  # 可选：添加调度器服务
  carinfo-scheduler:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: carinfo-scheduler
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Hong_Kong
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=1qaz!QAZ2wsx@WSX
      - MYSQL_DATABASE=car_info_db
    volumes:
      - ./config.json:/app/config.json
      - ./proxy_config.json:/app/proxy_config.json
      - ./data:/app/data
      - ./logs:/app/logs
      - ./debug_pages:/app/debug_pages
      - ./csv_output:/app/csv_output
    networks:
      - carinfo-network
    command: ["python", "scheduler.py"]
    profiles:
      - scheduler  # 可选服务，使用 --profile scheduler 启动

  # 可选：Web监控服务（如果有webhook_service.py）
  carinfo-webhook:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: carinfo-webhook
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Hong_Kong
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=1qaz!QAZ2wsx@WSX
      - MYSQL_DATABASE=car_info_db
    volumes:
      - ./config.json:/app/config.json
      - ./proxy_config.json:/app/proxy_config.json
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - carinfo-network
    command: ["python", "webhook_service.py"]
    profiles:
      - webhook  # 可选服务，使用 --profile webhook 启动

networks:
  carinfo-network:
    driver: bridge

volumes:
  carinfo-data:
    driver: local
  carinfo-logs:
    driver: local
