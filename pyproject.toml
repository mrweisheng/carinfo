 [build-system]
 requires = ["setuptools>=69", "wheel"]
 build-backend = "setuptools.build_meta"
 
 [project]
 name = "carinfo-service"
 version = "0.1.0"
 description = "Carinfo scraper service (scheduler + one-shot run)"
 requires-python = ">=3.10"
 dependencies = [
   "pandas==2.1.4",
   "requests==2.31.0",
   "beautifulsoup4==4.12.2",
   "PyMySQL==1.1.0",
   "mysql-connector-python==8.2.0",
   "schedule==1.2.0",
   "python-dotenv==1.0.0",
 ]
 
 [tool.setuptools]
 package-dir = {"" = "src"}
 
 [tool.setuptools.packages.find]
 where = ["src"]
 
 [project.scripts]
 carinfo-service = "carinfo_service.cli:main"
