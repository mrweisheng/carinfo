[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carinfo"
version = "0.2.0"
description = "carinfo: 香港汽车信息爬取与调度服务（多站点可扩展架构）"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0,<3.0.0",
  "requests==2.31.0",
  "beautifulsoup4==4.12.2",
  "psycopg2-binary>=2.9,<3.0",
  "python-dotenv==1.0.0",
  "curl_cffi",
  "fastapi>=0.141.1",
  "uvicorn>=0.53.0",
  "mcp>=2.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
carinfo-service = "carinfo.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100
